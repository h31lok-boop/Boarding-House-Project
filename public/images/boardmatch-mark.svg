<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">BoardMatch icon</title>
  <desc id="desc">A navy and blue boarding house compatibility mark for BoardMatch.</desc>
  <defs>
    <linearGradient id="bm-bg" x1="12" y1="10" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bm-roof" x1="24" y1="25" x2="72" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="bm-shadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bm-bg)"/>
  <g filter="url(#bm-shadow)">
