<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Boarding house room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ece4"/>
      <stop offset="100%" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b89a"/>
      <stop offset="100%" stop-color="#b8a888"/>
    </linearGradient>
    <linearGradient id="bed-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7355"/>
      <stop offset="100%" stop-color="#6b5540"/>
    </linearGradient>
    <linearGradient id="mattress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f2"/>
      <stop offset="100%" stop-color="#edeae4"/>
    </linearGradient>
    <linearGradient id="window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d4f0"/>
      <stop offset="100%" stop-color="#d4eaf8"/>
    </linearGradient>
    <linearGradient id="lamp-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e8c0"/>
      <stop offset="100%" stop-color="#e8d498"/>
    </linearGradient>
  </defs>

  <!-- Back wall -->
  <rect width="800" height="500" fill="url(#wall)"/>

  <!-- Floor -->
  <polygon points="0,340 800,340 800,500 0,500" fill="url(#floor)"/>
  <!-- Floor boards -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#a89878" stroke-width="1.5" opacity="0.5"/>
  <!-- Vertical board seams -->
  <line x1="133" y1="340" x2="133" y2="500" stroke="#a89878" stroke-width="1" opacity="0.4"/>
  <line x1="266" y1="340" x2="266" y2="500" stroke="#a89878" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="340" x2="400" y2="500" stroke="#a89878" stroke-width="1" opacity="0.4"/>
  <line x1="533" y1="340" x2="533" y2="500" stroke="#a89878" stroke-width="1" opacity="0.4"/>
  <line x1="666" y1="340" x2="666" y2="500" stroke="#a89878" stroke-width="1" opacity="0.4"/>

  <!-- Wall baseboard -->
  <rect x="0" y="332" width="800" height="8" fill="#c8baa8" opacity="0.6"/>

  <!-- Window on left wall -->
  <rect x="60" y="60" width="200" height="200" rx="4" fill="url(#window-sky)" stroke="#d4c8b0" stroke-width="4"/>
  <!-- Window cross bars -->
  <line x1="160" y1="64" x2="160" y2="256" stroke="#d4c8b0" stroke-width="4"/>
  <line x1="64" y1="162" x2="256" y2="162" stroke="#d4c8b0" stroke-width="4"/>
  <!-- Window frame -->
  <rect x="60" y="60" width="200" height="200" rx="4" fill="none" stroke="#c0b09a" stroke-width="6"/>
  <!-- Window sill -->
  <rect x="48" y="256" width="224" height="12" rx="2" fill="#c8baa0"/>

  <!-- Left curtain -->
  <path d="M52,60 Q70,100 60,160 Q70,220 60,256 L52,256 Z" fill="#d4c0a8" opacity="0.85"/>
  <line x1="52" y1="60" x2="60" y2="256" stroke="#c0aa90" stroke-width="1" opacity="0.5"/>
  <!-- Right curtain -->
  <path d="M268,60 Q250,100 260,160 Q250,220 260,256 L268,256 Z" fill="#d4c0a8" opacity="0.85"/>
  <line x1="268" y1="60" x2="260" y2="256" stroke="#c0aa90" stroke-width="1" opacity="0.5"/>
  <!-- Curtain rod -->
  <rect x="44" y="52" width="232" height="10" rx="5" fill="#a09080"/>
  <circle cx="44" cy="57" r="7" fill="#8a7868"/>
  <circle cx="276" cy="57" r="7" fill="#8a7868"/>

  <!-- ── BED ── -->
  <!-- Bed frame -->
  <rect x="280" y="200" width="420" height="150" rx="6" fill="url(#bed-frame)"/>
  <!-- Headboard -->
  <rect x="280" y="160" width="420" height="55" rx="8" fill="#7a6348"/>
  <!-- Headboard panels -->
  <rect x="295" y="172" width="180" height="32" rx="4" fill="#6a5538" opacity="0.4"/>
  <rect x="490" y="172" width="195" height="32" rx="4" fill="#6a5538" opacity="0.4"/>
  <!-- Mattress -->
  <rect x="290" y="205" width="400" height="135" rx="5" fill="url(#mattress)"/>
  <!-- White sheet / duvet -->
  <rect x="290" y="230" width="400" height="110" rx="5" fill="#faf8f5"/>
  <!-- Pillow 1 -->
  <rect x="305" y="210" width="150" height="75" rx="8" fill="#f5f2ec"/>
  <rect x="310" y="215" width="140" height="65" rx="6" fill="#fefefe" opacity="0.8"/>
  <!-- Pillow 2 -->
  <rect x="475" y="210" width="150" height="75" rx="8" fill="#f5f2ec"/>
  <rect x="480" y="215" width="140" height="65" rx="6" fill="#fefefe" opacity="0.8"/>
  <!-- Bed legs -->
  <rect x="285" y="330" width="18" height="20" rx="3" fill="#5a4030"/>
  <rect x="680" y="330" width="18" height="20" rx="3" fill="#5a4030"/>

  <!-- ── NIGHTSTAND / SIDE TABLE ── -->
  <rect x="640" y="255" width="95" height="90" rx="4" fill="#9a8060"/>
  <!-- Drawer -->
  <rect x="648" y="270" width="79" height="32" rx="3" fill="#8a7050" opacity="0.7"/>
  <!-- Drawer handle -->
  <circle cx="687" cy="286" r="4" fill="#c8b080"/>
  <!-- Table top -->
  <rect x="632" y="250" width="110" height="10" rx="3" fill="#a88868"/>

  <!-- ── LAMP ── -->
  <!-- Lamp base -->
  <rect x="672" y="220" width="16" height="35" rx="3" fill="#b09070"/>
  <!-- Lamp shade -->
  <polygon points="652,225 732,225 718,172 666,172" fill="url(#lamp-shade)" opacity="0.95"/>
  <line x1="652" y1="225" x2="732" y2="225" stroke="#c8b070" stroke-width="2"/>
  <!-- Lamp glow -->
  <ellipse cx="692" cy="230" rx="40" ry="15" fill="#fff8e0" opacity="0.25"/>

  <!-- ── SMALL RUG ── -->
  <ellipse cx="490" cy="360" rx="155" ry="25" fill="#c0a888" opacity="0.55"/>
  <!-- Rug border -->
  <ellipse cx="490" cy="360" rx="145" ry="21" fill="none" stroke="#b09878" stroke-width="2.5" opacity="0.6"/>

  <!-- ── SMALL POTTED PLANT (corner) ── -->
  <rect x="718" y="310" width="28" height="30" rx="4" fill="#8a7058"/>
  <ellipse cx="732" cy="310" rx="14" ry="5" fill="#7a6048"/>
  <!-- Leaves -->
  <ellipse cx="732" cy="285" rx="22" ry="28" fill="#6aaa66" opacity="0.85"/>
  <ellipse cx="718" cy="295" rx="16" ry="20" fill="#5a9a58" opacity="0.8"/>
  <ellipse cx="748" cy="298" rx="14" ry="18" fill="#5a9a58" opacity="0.8"/>
  <ellipse cx="732" cy="268" rx="14" ry="18" fill="#7aba70" opacity="0.75"/>
</svg>
