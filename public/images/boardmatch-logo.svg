<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 96" role="img" aria-labelledby="title desc">
  <title id="title">BoardMatch logo</title>
  <desc id="desc">BoardMatch wordmark with a navy and blue boarding house icon.</desc>
  <defs>
    <linearGradient id="bm-logo-bg" x1="12" y1="10" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bm-logo-roof" x1="24" y1="25" x2="72" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="bm-logo-shadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#bm-logo-bg)"/>
  <g filter="url(#bm-logo-shadow)">
    <path d="M23.5 47.5 48 28l24.5 19.5" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 47.8 48 32.5l20 15.3v25.7a4.5 4.5 0 0 1-4.5 4.5h-31a4.5 4.5 0 0 1-4.5-4.5V47.8Z" fill="url(#bm-logo-roof)"/>
    <path d="M38 59h20" stroke="#1E40AF" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M38 68h13" stroke="#1E40AF" stroke-width="5.2" stroke-linecap="round"/>
    <circle cx="63" cy="66" r="12" fill="#0F172A"/>
    <path d="m57.8 66.1 3.7 3.8 7.4-8" fill="none" stroke="#93C5FD" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="116" y="58" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850" letter-spacing="-1.8">Board</text>
  <text x="222" y="58" fill="#93C5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850" letter-spacing="-1.8">Match</text>
  <text x="118" y="78" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">BOARDING HOUSE MATCHMAKING</text>
</svg>
